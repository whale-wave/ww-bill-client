apply plugin: 'com.android.application'

def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersionName = packageJson.version as String
def appVersionCode = packageJson.appRelease?.androidVersionCode as Integer
if (!appVersionName || !appVersionCode || appVersionCode < 1) {
    throw new GradleException('package.json must define version and appRelease.androidVersionCode')
}

def releaseSigning = [
    storeFile: System.getenv('WW_BILL_ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('WW_BILL_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('WW_BILL_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('WW_BILL_ANDROID_KEY_PASSWORD'),
]
def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (isReleaseTask && releaseSigning.values().any { !it }) {
    throw new GradleException('Release builds require WW_BILL_ANDROID_KEYSTORE_PATH, WW_BILL_ANDROID_KEYSTORE_PASSWORD, WW_BILL_ANDROID_KEY_ALIAS and WW_BILL_ANDROID_KEY_PASSWORD')
}

def generatedAppId = "com.demo.www"
def capacitorConfigFile = file('src/main/assets/capacitor.config.json')
if (capacitorConfigFile.exists()) {
    try {
        def capacitorConfig = new groovy.json.JsonSlurper().parseText(capacitorConfigFile.text)
        if (capacitorConfig.appId instanceof String && capacitorConfig.appId ==~ /[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)+/) {
            generatedAppId = capacitorConfig.appId
        }
    } catch (Exception ignored) {
        logger.warn("Unable to read appId from capacitor.config.json; using ${generatedAppId}")
    }
}

android {
    namespace = "com.easyhappy.wwbill"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId generatedAppId
        resValue "string", "package_name", generatedAppId
        resValue "string", "custom_url_scheme", generatedAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigning.storeFile) {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
