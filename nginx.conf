server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Revalidate the app entry point on every launch so a new deploy can load
    # its content-hashed assets without keeping users on an old app shell.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # These stable URLs change between PWA releases and must not stay fresh in
    # the browser cache. The manifest type is not included by nginx by default.
    location = /site.webmanifest {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /apple-touch-icon.png {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ ^/icons/apple-touch-icon-(152|167|180)\.png$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite fingerprints these files, so they are safe and efficient to cache
    # for a long time. A new index.html points at new filenames after deploy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
