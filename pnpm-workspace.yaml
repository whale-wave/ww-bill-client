allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - synckit@0.9.3
  - tailwind-merge@2.6.1
  - undici-types@6.21.0
patchedDependencies:
  '@locator/babel-jsx@0.5.1': patches/@locator__babel-jsx@0.5.1.patch
