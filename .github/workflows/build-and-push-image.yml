name: Build and push client image

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: whale-wave/ww-bill-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve application build metadata
        id: app_metadata
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const refName = process.env.REF_NAME;
          const refType = process.env.REF_TYPE;
          const releaseVersion = refType === 'tag' ? refName.replace(/^v/, '') : packageVersion;
          if (refType === 'tag' && (refName === releaseVersion || releaseVersion !== packageVersion)) {
            throw new Error(`Release tag ${refName} must match package.json version v${packageVersion}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${releaseVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${process.env.GITHUB_SHA}\n`);
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VITE_IOS_SHORTCUT_URL=${{ vars.VITE_IOS_SHORTCUT_URL }}
            APP_VERSION=${{ steps.app_metadata.outputs.version }}
            APP_BUILD_ID=${{ steps.app_metadata.outputs.build_id }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
